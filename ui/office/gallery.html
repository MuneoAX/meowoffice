<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," /><!-- 창마다 없는 favicon.ico 를 찾는 오류 로그 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고양이 도감</title>
  <style>
    html, body { margin: 0; height: 100%; background: #eceef2; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    #labels div { position: absolute; transform: translate(-50%, 0); padding: 3px 12px; border-radius: 10px;
      background: #e1e4ea; color: #333; font-size: 13px; white-space: nowrap; }
    #bar { position: absolute; top: 12px; right: 16px; display: flex; gap: 6px; }
    #bar button { border: 1px solid #c9ccd3; background: #fff; border-radius: 14px; padding: 5px 12px; cursor: pointer; }
    #bar button.on { background: #5b5f6b; color: #fff; border-color: #5b5f6b; }
  </style>
</head>
<body>
  <!-- 개발용 도감: 품종 16종 + 대표를 한 화면에. ?anim=sit_type 처럼 동작을 고를 수 있다 -->
  <canvas id="view"></canvas>
  <div id="labels"></div>
  <div id="bar"><button id="front" class="on">정면</button><button id="side">옆면</button></div>
  <script src="../vendor/babylon/babylon.js"></script>
  <script src="../vendor/babylon/babylon.glTF2FileLoader.min.js"></script>
  <script src="decoders.js"></script>
  <script src="catmodel.js"></script>
  <script>
    (async () => {
      const canvas = document.getElementById('view');
      const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true });
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.925, 0.933, 0.949, 1);
      const cam = new BABYLON.ArcRotateCamera('cam', Math.PI / 2, 1.4, 12, new BABYLON.Vector3(0, -0.85, 0), scene);
      cam.attachControl(canvas, true);
      cam.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
      new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.2, 1, 0.4), scene).intensity = 0.95;
      const sun = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-0.3, -0.8, -0.7), scene); sun.intensity = 0.75; // 카메라 쪽(정면)에서 비춤
      await CatModel.preload(scene);
      const params = new URLSearchParams(location.search);
      const anim = params.get('anim') || 'idle';
      const list = [...CatModel.breeds(), 'boss'];
      const COLS = Math.ceil(list.length / 3), DX = 1.15, DY = 1.3; // 도감처럼 3줄, 줄마다 위아래로 띄운다
      const cats = [];
      list.forEach((breed, i) => {
        const root = new BABYLON.TransformNode('cat' + i, scene);
        const col = i % COLS, row = Math.floor(i / COLS);
        root.position.set(-(col - (COLS - 1) / 2) * DX, -row * DY, 0);
        const cat = { id: 'g' + i, root, pose: 'stand', act: 'idle', t: Math.random() * 5, mood: 1, hopT: 0 };
        cat.model = CatModel.attach(scene, cat, breed);
        cat.model.top.position.y = -cat.model.legDrop; // 짧게 줄인 다리 (서 있는 자세)
        // 동작 고정 재생
        const g = cat.model.groups[anim] || cat.model.groups.idle;
        g.start(true, 1);
        cat.model.anim = anim;
        cats.push(cat);
      });
      const fit = () => {
        const a = engine.getRenderWidth() / engine.getRenderHeight();
        const w = Math.max(2.1, (COLS * DX / 2 + 0.2) / a); // 가로로 다 들어오게
        cam.orthoLeft = -w * a; cam.orthoRight = w * a; cam.orthoTop = w; cam.orthoBottom = -w;
      };
      fit(); window.addEventListener('resize', () => { engine.resize(); fit(); });
      // 카메라는 그대로 두고 고양이를 제자리에서 돌린다 (일렬 배치 유지 → 옆모습 비교)
      const turn = (ry) => cats.forEach((c) => { c.root.rotationQuaternion = null; c.root.rotation.y = ry; });
      document.getElementById('front').onclick = () => { turn(Math.PI); on('front'); };
      document.getElementById('side').onclick = () => { turn(-Math.PI / 2); on('side'); };
      turn(Math.PI); // 모델 정면은 -Z, 카메라는 +Z 쪽
      const on = (id) => document.querySelectorAll('#bar button').forEach((b) => b.classList.toggle('on', b.id === id));
      const labels = document.getElementById('labels');
      const tags = list.map((b) => { const d = document.createElement('div'); d.textContent = CatModel.breedName(b); labels.appendChild(d); return d; });
      engine.runRenderLoop(() => {
        scene.render();
        const vp = cam.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight());
        cats.forEach((c, i) => {
          const p = BABYLON.Vector3.Project(c.root.position.add(new BABYLON.Vector3(0, -0.05, 0)), BABYLON.Matrix.Identity(), scene.getTransformMatrix(), vp);
          tags[i].style.left = p.x / engine.getHardwareScalingLevel() + 'px';
          tags[i].style.top = p.y + 'px';
        });
      });
    })();
  </script>
</body>
</html>
