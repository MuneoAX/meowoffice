# 릴리스: v* 태그를 올리면 Windows·macOS 설치 파일을 만들어 GitHub 릴리스에 올린다.
#   npm run release -- --bump patch --notes-file dist/notes.md   (노트를 주석 태그 메시지로 넣어 push)
#   또는 git tag -a v0.6.7 --cleanup=verbatim -F notes.md && git push origin v0.6.7
# 흐름: build(두 OS, 초안에 올림) → publish(latest.json·서명 확인 후 게시). 확인에 실패하면 초안으로 남는다.
# 서명: 저장소 비밀값 TAURI_SIGNING_PRIVATE_KEY 가 있으면 자동 업데이트용 서명(.sig)·latest.json 까지 만든다.
#       키가 없으면 업데이트 산출물을 끄고 설치 파일만 만들며 게시하지 않는다(맥 설치본은 업데이트를 못 받는다).
# 앱의 업데이트 확인: releases/latest/download/latest.json 을 먼저(맥은 이것만), 응답이 없으면 muneo.co.kr 피드(Windows 만).
# 방식: tauri-apps/tauri-action (Tauri 공식). macOS 는 Intel·Apple Silicon 겸용(universal) 하나.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      # 릴리스 노트 = 주석 태그 메시지(scripts/release.mjs 가 --notes 로 만든다). checkout 은 주석 태그를 가벼운 태그로 덮어써서 다시 받는다.
      - name: 릴리스 노트(태그 메시지)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] && [ -n "$body" ] || body="변경 내용은 커밋 기록을 참고하세요."
          { echo "RELEASE_NOTES<<__NOTES__"; echo "$body"; echo "__NOTES__"; } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # 서명 키가 없으면 업데이트 산출물(.sig) 생성을 끈다 — 켜 둔 채 키가 없으면 빌드가 실패한다
      - name: 서명 없음 설정
        if: env.HAS_KEY != 'true'
        shell: bash
        run: |
          f="$RUNNER_TEMP/no-updater.json"
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$f"
          echo "NO_UPDATER_ARGS=--config $f" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Meowffice ${{ github.ref_name }}"
          # 본문은 latest.json 의 notes 로도 들어가 앱 업데이트 창에 그대로 보인다
          releaseBody: ${{ env.RELEASE_NOTES || '변경 내용은 커밋 기록을 참고하세요.' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_KEY == 'true' }}
          # 윈도우 업데이트는 NSIS 설치 파일로(사용자 설치본·자체 서버 피드와 같은 형식, MSI 와 섞이면 이중 설치)
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.NO_UPDATER_ARGS }}

  # 두 OS 빌드가 모두 성공하면 게시한다 — 게시해야 releases/latest 로 잡혀 앱이 업데이트를 본다.
  # 게시 전 확인: latest.json 버전 = 태그, 세 플랫폼이 다 있음(하나라도 빠지면 그 OS 는 확인 오류이고 muneo 로 넘어가지 않음),
  # 각 서명의 키 id 가 앱에 든 공개 키(tauri.conf.json)와 같음(다르면 내려받은 뒤 서명 확인 실패로 전원 설치 불가).
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: 확인 후 게시
        if: env.HAS_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release download "$tag" -p latest.json -D "$RUNNER_TEMP/r"
          f="$RUNNER_TEMP/r/latest.json"
          # minisign: 두 번째 줄을 base64 로 풀면 [알고리즘 2바이트][키 id 8바이트]...
          keyid() { base64 -d <<<"$1" | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | od -An -tx1 | tr -d ' \n'; }
          want="$(keyid "$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)")"
          got="$(jq -r '.version' "$f")"
          [ "${got#v}" = "${tag#v}" ] || { echo "::error::latest.json 버전($got)이 $tag 와 다름"; exit 1; }
          for p in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            sig="$(jq -r --arg p "$p" '.platforms[$p].signature // empty' "$f")"
            [ -n "$sig" ] || { echo "::error::latest.json 에 $p 없음"; exit 1; }
            [ "$(keyid "$sig")" = "$want" ] || { echo "::error::$p 서명 키가 앱 공개 키($want)와 다름"; exit 1; }
          done
          gh release edit "$tag" --draft=false --latest
          echo "게시: $tag (플랫폼 3, 키 $want)"
