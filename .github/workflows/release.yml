# 릴리스: v* 태그를 올리면 Windows·macOS 설치 파일을 만들어 GitHub 릴리스 초안에 올린다.
#   npm run release -- --bump patch --notes-file notes.md   (노트를 주석 태그 메시지로 넣어 push)
#   또는 git tag -a v0.6.7 --cleanup=verbatim -F notes.md && git push origin v0.6.7
#   → Actions 가 끝나면 Releases 의 초안을 확인하고 [Publish]
# 서명: 저장소 비밀값 TAURI_SIGNING_PRIVATE_KEY 가 있으면 자동 업데이트용 서명(.sig)·latest.json 까지 만든다.
#       앱은 releases/latest/download/latest.json 을 먼저 확인하고(맥은 이것만 가능), 없으면 muneo.co.kr 피드를 본다.
#       없으면 업데이트 산출물을 끄고 설치 파일만 만든다 — 그러면 맥 설치본은 자동 업데이트를 받지 못한다.
# 방식: tauri-apps/tauri-action (Tauri 공식). macOS 는 Intel·Apple Silicon 겸용(universal) 하나.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      # 릴리스 노트 = 주석 태그 메시지(scripts/release.mjs 가 --notes 로 만든다). checkout 은 주석 태그를 가벼운 태그로 덮어써서 다시 받는다.
      - name: 릴리스 노트(태그 메시지)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] && [ -n "$body" ] || body="변경 내용은 커밋 기록을 참고하세요."
          { echo "RELEASE_NOTES<<__NOTES__"; echo "$body"; echo "__NOTES__"; } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # 서명 키가 없으면 업데이트 산출물(.sig) 생성을 끈다 — 켜 둔 채 키가 없으면 빌드가 실패한다
      - name: 서명 없음 설정
        if: env.HAS_KEY != 'true'
        shell: bash
        run: |
          f="$RUNNER_TEMP/no-updater.json"
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$f"
          echo "NO_UPDATER_ARGS=--config $f" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Meowffice ${{ github.ref_name }}"
          # 본문은 latest.json 의 notes 로도 들어가 앱 업데이트 창에 그대로 보인다
          releaseBody: ${{ env.RELEASE_NOTES || '변경 내용은 커밋 기록을 참고하세요.' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_KEY == 'true' }}
          # 윈도우 업데이트는 NSIS 설치 파일로(사용자 설치본·자체 서버 피드와 같은 형식, MSI 와 섞이면 이중 설치)
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.NO_UPDATER_ARGS }}
